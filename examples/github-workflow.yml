# Example workflow: validate the dataset on every pull request that touches it,
# fail only on regressions relative to the approved baseline, and surface the
# findings in code scanning. Copy to .github/workflows/dataset-sentinel.yml.
#
# Create / refresh the baseline locally and commit it:
#   sentinel baseline create data -o .sentinel/baseline.json
name: Dataset integrity

on:
  pull_request:
    paths:
      - "data/**"
      - "sentinel.yaml"
      - ".sentinel/baseline.json"
  schedule:
    - cron: "0 6 * * 1"          # weekly scan for changes that bypass pull requests
  workflow_dispatch:

jobs:
  sentinel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write         # PR comment
      security-events: write       # SARIF upload
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true                # if images are stored with Git LFS

      - name: Restore fingerprint cache
        uses: actions/cache@v4
        with:
          path: .sentinel-cache
          key: sentinel-${{ hashFiles('data/**') }}
          restore-keys: sentinel-

      - name: Dataset Sentinel
        id: sentinel
        uses: N-Lampl/Sentinel@main          # pin to a tag once releases exist
        with:
          path: data
          config: sentinel.yaml                 # optional
          baseline: .sentinel/baseline.json     # optional: fail only on regressions
          new-only: "true"
          fail-on: error
          sarif: "true"
          fix-plan: "true"
          args: "--set policy.near_duplicate.threshold=5"

      - name: Upload findings to code scanning
        if: always() && steps.sentinel.outputs.sarif-report != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.sentinel.outputs.sarif-report }}

      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sentinel-report/summary.md', 'utf8');
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body,
            });
