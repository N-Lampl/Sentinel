name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build twine
          python -m build
          twine check dist/*
      - name: Install the wheel and run the demo
        run: |
          python -m pip install --quiet dist/*.whl
          python examples/make_demo_dataset.py demo-dataset
          sentinel scan demo-dataset --no-report -q || test $? -eq 1

  self-test-action:
    # Runs the composite action against a generated demo dataset with planted problems.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate demo dataset
        run: |
          python -m pip install -q numpy pillow
          python examples/make_demo_dataset.py demo-dataset
      - name: Dataset Sentinel (expected to report violations, not fail the job)
        id: sentinel
        uses: ./
        with:
          path: demo-dataset
          version: local
          fail-on: none
          max-violation-rate: "1"
      - name: Check outputs
        run: |
          echo "passed=${{ steps.sentinel.outputs.passed }} violation-rate=${{ steps.sentinel.outputs.violation-rate }} errors=${{ steps.sentinel.outputs.errors }}"
          test "${{ steps.sentinel.outputs.errors }}" -gt 0
          test -f sentinel-report/report.html
          test -f sentinel-report/fix-plan.json
      - name: Baseline / diff round-trip (no regression -> pass)
        run: |
          python -m pip install -q .
          sentinel baseline create demo-dataset -o .sentinel/baseline.json --no-cache
          sentinel diff demo-dataset --baseline .sentinel/baseline.json --no-report --no-cache
      - name: Diff with a planted regression (-> exit 1)
        run: |
          cp demo-dataset/train/train_010.jpg demo-dataset/test/regression.jpg
          python - <<'PY'
          import json
          p = "demo-dataset/annotations/instances_test.json"
          d = json.load(open(p))
          d["images"].append({"id": 99001, "file_name": "regression.jpg", "width": 160, "height": 120})
          json.dump(d, open(p, "w"))
          PY
          if sentinel diff demo-dataset --baseline .sentinel/baseline.json --no-report --no-cache; then
            echo "expected the diff to fail on the new duplicate" && exit 1
          fi
